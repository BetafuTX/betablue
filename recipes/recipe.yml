---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/<your-github-user>/bazzite-niri
name: bazzite-niri
description: Bazzite (KDE Plasma) with the niri scrolling-tiling compositor and Dank Material Shell (Dux Shell) pre-installed as an extra login session.

# Layer on top of the published Bazzite desktop image so every upstream
# Bazzite update flows into this image on the next daily rebuild.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - from-file: common/niri-dms.yml
  - type: signing # installs the policy/signing files so signed rebases work
